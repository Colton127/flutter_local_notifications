name: Apply custom action receiver patch

on:
  push:
    branches:
      - agent/custom-android-action-receiver

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custom-android-action-receiver
          fetch-depth: 0
      - name: Apply implementation
        run: |
          cat .github/patch/custom-action-receiver.part* | base64 --decode > /tmp/custom-action-receiver.patch
          git apply --index /tmp/custom-action-receiver.patch
          rm -rf .github/patch
          rm .github/workflows/export-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add custom Android notification action receivers"
          git push origin HEAD:agent/custom-android-action-receiver
