name: Publish custom action receiver implementation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custom-android-action-receiver
          show-progress: false
      - name: Assemble and apply implementation
        run: |
          cat \
            .github/patch/custom-action-receiver.part00 \
            .github/patch/custom-action-receiver.part01 \
            .github/patch/custom-action-receiver.part02a \
            .github/patch/custom-action-receiver.part02b \
            .github/patch/custom-action-receiver.part03 \
            .github/patch/custom-action-receiver.part04 \
            .github/patch/custom-action-receiver.part05a \
            .github/patch/custom-action-receiver.part05b \
            .github/patch/custom-action-receiver.part06a0 \
            .github/patch/custom-action-receiver.part06a1 \
            .github/patch/custom-action-receiver.part06a2 \
            .github/patch/custom-action-receiver.part06b \
            | base64 --decode > /tmp/custom-action-receiver.patch
          echo "4b6f6b80d95e67bb21a218bdfefcd03a3bffd8642feba274016a5fc0d835f901  /tmp/custom-action-receiver.patch" | sha256sum --check
          git apply --check --verbose /tmp/custom-action-receiver.patch
          git apply --index /tmp/custom-action-receiver.patch
      - name: Remove temporary staging files
        run: |
          rm -rf .github/patch
          rm .github/workflows/export-source.yml
          git add -A
      - name: Commit and push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add custom Android notification action receivers"
          git push origin HEAD:agent/custom-android-action-receiver
