name: Diagnose corrected custom action receiver patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custom-android-action-receiver
          show-progress: false
      - name: Assemble and validate patch
        run: |
          cat \
            .github/patch/custom-action-receiver.part00 \
            .github/patch/custom-action-receiver.part01 \
            .github/patch/custom-action-receiver.part02a \
            .github/patch/custom-action-receiver.part02b \
            .github/patch/custom-action-receiver.part03 \
            .github/patch/custom-action-receiver.part04 \
            .github/patch/custom-action-receiver.part05a \
            .github/patch/custom-action-receiver.part05b \
            .github/patch/custom-action-receiver.part06a \
            .github/patch/custom-action-receiver.part06b \
            | base64 --decode > /tmp/custom-action-receiver.patch
          sha256sum /tmp/custom-action-receiver.patch > /tmp/patch-sha.txt
          git apply --check --verbose /tmp/custom-action-receiver.patch > /tmp/apply-check.txt 2>&1 || true
      - name: Export diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: corrected-custom-action-receiver-diagnostics
          path: |
            /tmp/custom-action-receiver.patch
            /tmp/patch-sha.txt
            /tmp/apply-check.txt
