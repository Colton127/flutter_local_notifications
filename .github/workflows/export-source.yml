name: Apply custom action receiver patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/custom-android-action-receiver
          show-progress: false
      - name: Verify replacement segment 02a
        continue-on-error: true
        run: echo "f229cfc9f8d90c864fefe0a80bad193abfc714798c61ca2566850e111217d844  .github/patch/custom-action-receiver.part02a" | sha256sum --check
      - name: Verify replacement segment 02b
        continue-on-error: true
        run: echo "802ccb21306a9519cc08ee75c28bc63c51ed1066066b1f6aec37d3f97d89e3d1  .github/patch/custom-action-receiver.part02b" | sha256sum --check
      - name: Verify replacement segment 05a
        continue-on-error: true
        run: echo "ce381ed315df4067d225211cf909565834a7a7b6c9ad92c46af430b6f7497eca  .github/patch/custom-action-receiver.part05a" | sha256sum --check
      - name: Verify replacement segment 05b
        continue-on-error: true
        run: echo "f94d5f3f2e96d56b8273c9c9ae811b443e100a43ae6bf39b001432ea47efa222  .github/patch/custom-action-receiver.part05b" | sha256sum --check
      - name: Verify replacement segment 06a
        continue-on-error: true
        run: echo "d84a9645b8365b659e718a279a2bdec42e349efc948fdda319122c238a87e8b0  .github/patch/custom-action-receiver.part06a" | sha256sum --check
      - name: Verify replacement segment 06b
        continue-on-error: true
        run: echo "bf67eb542581dd99ea10491434e79ece89d24960ad8d63cd5edffff4f3284efe  .github/patch/custom-action-receiver.part06b" | sha256sum --check
      - name: Assemble and decode patch
        run: |
          cat \
            .github/patch/custom-action-receiver.part00 \
            .github/patch/custom-action-receiver.part01 \
            .github/patch/custom-action-receiver.part02a \
            .github/patch/custom-action-receiver.part02b \
            .github/patch/custom-action-receiver.part03 \
            .github/patch/custom-action-receiver.part04 \
            .github/patch/custom-action-receiver.part05a \
            .github/patch/custom-action-receiver.part05b \
            .github/patch/custom-action-receiver.part06a \
            .github/patch/custom-action-receiver.part06b \
            | base64 --decode > /tmp/custom-action-receiver.patch
          echo "4b6f6b80d95e67bb21a218bdfefcd03a3bffd8642feba274016a5fc0d835f901  /tmp/custom-action-receiver.patch" | sha256sum --check
      - name: Check and apply implementation
        run: |
          git apply --check --verbose /tmp/custom-action-receiver.patch
          git apply --index /tmp/custom-action-receiver.patch
      - name: Remove temporary staging files
        run: |
          rm -rf .github/patch
          rm .github/workflows/export-source.yml
          git add -A
      - name: Commit and push implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add custom Android notification action receivers"
          git push origin HEAD:agent/custom-android-action-receiver
